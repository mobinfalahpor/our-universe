name: انتشار در گیت‌هاب پیجز

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4
      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: نصب وابستگی‌ها
        run: npm ci
      - name: ساخت نسخه نهایی
        env:
          VITE_BASE_PATH: "./"
        run: npm run build
      - name: بارگذاری خروجی برای Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: انتشار در GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
